[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geostitch"
version = "0.1.0"
description = "A desktop control-point workspace for image registration and georeferencing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7", "Pillow>=10.0", "numpy>=1.26", "scipy>=1.13", "pyproj>=3.6"]

[project.optional-dependencies]
test = ["pytest>=8.0", "rasterio>=1.4"]
build = ["pyinstaller>=6.0"]

[project.scripts]
geostitch = "geostitch.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geostitch = ["assets/*.png", "assets/*.ico", "assets/*.jpg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
